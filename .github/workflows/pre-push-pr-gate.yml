name: Pre-push Orchestrator Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Pre-push Orchestrator Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR packet
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "What and Why",
              "Changes",
              "Reviews and Follow-up",
              "Files Changed",
              "Scope and Non-scope",
              "Validation",
              "Testing",
              "Size and Notes",
            ];
            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const missing = required.filter((section) => !new RegExp(`^##\\s+${escapeRegExp(section)}\\b`, "im").test(body));
            const sectionBody = (section) => {
              const heading = body.match(new RegExp(`^##\\s+${escapeRegExp(section)}\\b`, "im"));
              if (!heading) return "";
              const rest = body.slice(heading.index + heading[0].length);
              const nextHeading = rest.search(/^##\s+/im);
              return nextHeading === -1 ? rest : rest.slice(0, nextHeading);
            };
            const testing = sectionBody("Testing");
            const weakTesting = !testing.trim() || /TODO|TBD|not tested|^\s*n\/?a\s*$/im.test(testing.trim());
            const issues = [];
            if (missing.length) issues.push(`Missing PR sections: ${missing.join(", ")}`);
            if (weakTesting) issues.push("Testing must include concrete commands, logs, screenshots, or an explicit risk-based reason.");
            if (issues.length) core.setFailed(issues.join("\n"));

      - name: Scan for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          git grep -nE '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{24,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)' -- \
            ':!*.md' \
            ':!*.lock' \
            ':!package-lock.json' \
            ':!pnpm-lock.yaml' \
            ':!yarn.lock' \
            ':!.env.example' \
            ':!**/*.test.*' \
            ':!**/*.spec.*' \
            ':!**/__tests__/**' \
            ':!tests/**' \
            ':!test/**' \
            ':!**/fixtures/**' \
            ':!**/mocks/**' \
            ':!**/examples/**' > /tmp/secret_hits.raw || true
          grep -Eiv 'AKIAIOSFODNN7EXAMPLE|example-secret|example-token|fake|dummy|placeholder|redacted' /tmp/secret_hits.raw > /tmp/secret_hits.txt || true
          if [ -s /tmp/secret_hits.txt ]; then
            echo "::error::High-confidence secret pattern detected. Remove the secret and rotate it before merging."
            cat /tmp/secret_hits.txt
            exit 1
          fi

      - name: Check changed size
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --numstat "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr_numstat.txt || true
          total=$(awk '{add += $1; del += $2} END {print add + del + 0}' /tmp/pr_numstat.txt)
          echo "Changed lines: ${total}"
          size_exception=$(node <<'NODE'
          const fs = require("fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const body = event.pull_request?.body || "";
          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const sectionBody = (section) => {
            const heading = body.match(new RegExp(`^##\\s+${escapeRegExp(section)}\\b`, "im"));
            if (!heading) return "";
            const rest = body.slice(heading.index + heading[0].length);
            const nextHeading = rest.search(/^##\s+/im);
            return nextHeading === -1 ? rest : rest.slice(0, nextHeading);
          };
          process.stdout.write(/\bsize exception\b/i.test(sectionBody("Size and Notes")) ? "true" : "false");
          NODE
          )
          if [ "${total}" -gt 2000 ] && [ "${size_exception}" != "true" ]; then
            echo "::error::PR exceeds 2000 changed lines. Split it or document an explicit size exception in Size and Notes."
            exit 1
          fi
